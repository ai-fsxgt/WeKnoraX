name: CLI
# Builds and tests the cli/ Go module on every push / PR that touches it.
# Foundation PR (PR-1) gates: ubuntu `go build` + `go test ./...` green.
on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'
defaults:
  run:
    working-directory: cli
    # Force bash
    shell: bash
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }} / go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ['1.26']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: cli/go.sum
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race -coverprofile=coverage.out ./...
      - name: go vet
        run: go vet ./...
      - name: Check agent-facing doc wire vocabulary
        run: scripts/check-skill-wire-vocab.sh
      - name: Check for committed credentials in docs
        run: scripts/check-secret-tokens.sh
      - name: coverage report
        run: go tool cover -func=coverage.out
